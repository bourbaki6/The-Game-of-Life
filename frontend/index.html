<!DOCTYPE html>
<html lang = "en">
<head>
<meta charset = "UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Game of Life</title>
<style>
  @import url('https://fonts.cdnfonts.com/css/offbit-trial');
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #08080e;
    --cell-alive: #e8e4d4;
    --accent: #c8a96e;
    --accent-dim: rgba(200,169,110,0.15);
    --text: #a09880;
    --text-dim: #4a4840;
    --border: rgba(200,169,110,0.12);
    --font-bit: 'OffBit Trial', 'DM Mono', monospace;
    --font-mono: 'DM Mono', monospace;
  }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    overflow: hidden;
    user-select: none;
  }
  #canvas-wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; cursor: crosshair; image-rendering: pixelated; }
  #canvas-wrap::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(8,8,14,0.85) 100%);
    pointer-events: none;
  }
  #scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
    pointer-events: none; z-index: 10;
  }
  #ui {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 20;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 28px 32px;
  }
  #header { display: flex; align-items: center; gap: 14px; }
  #title {
    font-family: var(--font-bit);
    font-size: 28px;
    color: var(--cell-alive);
    letter-spacing: 0.06em;
    line-height: 1;
    -webkit-text-stroke: 0.6px var(--cell-alive);
    text-shadow:
      0.5px  0    0 var(--cell-alive),
      -0.5px 0    0 var(--cell-alive),
      0      0.5px 0 var(--cell-alive),
      0     -0.5px 0 var(--cell-alive),
      0 0 24px rgba(232,228,212,0.22);
  }
  #subtitle {
    font-family: var(--font-bit);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    padding-top: 4px;
  }
  #conn-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-dim); flex-shrink: 0;
    transition: background 0.4s;
    box-shadow: none;
  }
  #conn-dot.ok  { background: #6a9a6e; box-shadow: 0 0 6px #6a9a6e88; }
  #conn-dot.err { background: #9a4a4a; box-shadow: 0 0 6px #9a4a4a88; }

  #stats { display: flex; gap: 28px; align-items: flex-start; margin-left: auto; }

  .stat { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .stat-val {
    font-family: var(--font-bit);
    font-size: 22px;
    color: var(--cell-alive);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    min-width: 64px;
    text-align: right;
    line-height: 1;
  }
  .stat-label {
    font-family: var(--font-bit);
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  #footer { display: flex; align-items: center; justify-content: space-between; }
  #controls { display: flex; gap: 6px; pointer-events: all; align-items: center; }
  button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-bit);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.18s;
    line-height: 1;
  }

  button:hover  { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  #boundary-wrap {
    display: flex; gap: 8px; pointer-events: all; align-items: center;
    margin-left: 14px;
  }
  #boundary-label {
    font-family: var(--font-bit);
    font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim);
  }
  select {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-bit);
    font-size: 10px; letter-spacing: 0.1em;
    padding: 7px 10px; cursor: pointer; outline: none;
    transition: border-color 0.18s;
  }
  select:hover { border-color: var(--accent); }
  select option { background: #12121a; color: var(--text); }

  #pattern-bar { display: flex; gap: 5px; pointer-events: all; }
  #pop-section { position: fixed; bottom: 80px; left: 32px; z-index: 21; }

  #pop-label {
    font-family: var(--font-bit);
    font-size: 9px; letter-spacing: 0.2em; color: var(--text-dim);
    text-transform: uppercase; margin-bottom: 5px;
  }
  #gen-graph { display: flex; align-items: flex-end; gap: 1px; height: 22px; }

  .gen-bar { width: 2px; background: var(--accent); opacity: 0.35; transition: height 0.08s; }

  #offline {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(8,8,14,0.94);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    transition: opacity 0.4s;
  }
  #offline.hidden { opacity: 0; pointer-events: none; }
  #offline-title {
    font-family: var(--font-bit);font-size: 22px;color: var(--cell-alive);letter-spacing: 0.1em;
  }
  #offline p {
    font-family: var(--font-bit);
    font-size: 10px; letter-spacing: 0.16em; color: var(--text-dim); text-transform: uppercase;
  }
  #offline code {
    font-family: var(--font-mono);
    font-size: 13px; color: var(--accent); letter-spacing: 0.08em;
    border: 1px solid var(--border); padding: 8px 16px;
  }

  @keyframes fadein { from{opacity:0} to{opacity:1} }
  body { animation: fadein 1s ease both; }
</style>
</head>
<body>

<div id = "canvas-wrap"><canvas id = "c"></canvas></div>
<div id = "scanlines"></div>
<div id = "offline">
  <div id = "offline-title">GAME OF LIFE</div>
  <p>Start the Python server first</p>
  <code>uvicorn server:app --reload</code>
  <p style = "margin-top:4px">then refresh this page</p>
</div>

<div id= "ui">
  <div id="header">
    <span id = "title">GAME OF LIFE</span>
    <span id = "subtitle">CONWAY · 1970</span>
    <div id = "conn-dot" title="Server connection"></div>
    <div id = "stats">
      <div class = "stat">
        <span class = "stat-val" id = "s-gen">0</span>
        <span class = "stat-label">Generation</span>
      </div>
      <div class="stat">
        <span class="stat-val" id="s-alive">0</span>
        <span class="stat-label">Alive</span>
      </div>
      <div class = "stat">
        <span class= "stat-val" id = "s-avg">—</span>
        <span class = "stat-label">Avg gen/s</span>
      </div>
    </div>
  </div>

  <div></div>
  <div>
    <div id = "pop-section">
      <div id = "pop-label">Population</div>
      <div id = "gen-graph"></div>
    </div>
    <div id = "footer">
      <div id = "controls">
        <button id = "btn-play" class="active">Pause</button>
        <button id = "btn-step">Step</button>
        <button id = "btn-clear">Clear</button>
        <div id = "boundary-wrap">
          <span id = "boundary-label">Boundary</span>
          <select id = "boundary-select">
            <option value = "toroidal" selected>Toroidal</option>
            <option value  = "dead">Dead cells</option>
          </select>
        </div>
      </div>
      <div id="pattern-bar">
        <button data-pattern = "random">Random</button>
        <button data-pattern = "glider">Glider</button>
        <button data-pattern = "pulsar">Pulsar</button>
        <button data-pattern = "gosper">Gosper Gun</button>
        <button data-pattern = "rpentomino">R-pentomino</button>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8000';
const CELL = 10;
const TARGET_INTERVAL = 55;
const POP_HISTORY = 48;
const AVG_WINDOW = 30;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let cols = 0, rows = 0;
let cells = null;
let running  = true;
let painting = false;
let paintValue = 1;
let pendingCells = [];
let popHistory = [], stepTimes = [];
let imageData, data32;

const BG_COLOR  = 0xFF0E0808;
const CELL_COLOR = 0xFFD4E4E8;

function setupCanvas(c, r) {
  cols = c; rows = r;
  canvas.width  = cols * CELL;
  canvas.height = rows * CELL;
  canvas.style.width  = canvas.width  + 'px';
  canvas.style.height = canvas.height + 'px';
  imageData = ctx.createImageData(canvas.width, canvas.height);
  data32  = new Uint32Array(imageData.data.buffer);
}

function gridSize() {
  return {
    cols: Math.floor(window.innerWidth  / CELL),
    rows: Math.floor(window.innerHeight / CELL),
  };
}

function render() {
  if (!cells) return;
  const w = canvas.width;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const color = cells[y * cols + x] ? CELL_COLOR : BG_COLOR;
      const px = x * CELL, py = y * CELL;
      for (let dy = 0; dy < CELL - 1; dy++) {
        for (let dx = 0; dx < CELL - 1; dx++)
          data32[(py + dy) * w + (px + dx)] = color;
        data32[(py + dy) * w + (px + CELL - 1)] = BG_COLOR;
      }
      for (let dx = 0; dx < CELL; dx++)
        data32[(py + CELL - 1) * w + (px + dx)] = BG_COLOR;
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

function updateStats(state) {
  document.getElementById('s-gen').textContent = state.generation.toLocaleString();
  document.getElementById('s-alive').textContent = state.alive.toLocaleString();

  const now = performance.now();
  stepTimes.push(now);
  if (stepTimes.length > AVG_WINDOW) stepTimes.shift();
  const avg = stepTimes.length > 1
    ? (stepTimes.length - 1) / ((stepTimes[stepTimes.length - 1] - stepTimes[0]) / 1000)
    : null;
  document.getElementById('s-avg').textContent = avg ? avg.toFixed(1) : '—';

  popHistory.push(state.alive);
  if (popHistory.length > POP_HISTORY) popHistory.shift();

  const graph = document.getElementById('gen-graph');
  if (graph.children.length !== POP_HISTORY) {
    graph.innerHTML = '';
    for (let i = 0; i < POP_HISTORY; i++) {
      const b = document.createElement('div');
      b.className = 'gen-bar';
      graph.appendChild(b);
    }
  }
  const max = Math.max(...popHistory, 1);
  [...graph.children].forEach((b, i) => {
    b.style.height = Math.max(1, (popHistory[i] ?? 0) / max * 22) + 'px';
  });
}

function setConn(ok) {
  const dot = document.getElementById('conn-dot');
  dot.className = ok ? 'ok' : 'err';
  document.getElementById('offline').classList.toggle('hidden', ok);
}

async function apiInit(pattern = 'random') {
  const { cols: c, rows: r } = gridSize();
  const boundary = document.getElementById('boundary-select').value;
  try {
    const res   = await fetch(`${API}/init`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cols: c, rows: r, pattern, boundary }),
    });
    const state = await res.json();
    setupCanvas(state.cols, state.rows);
    cells = new Uint8Array(state.cells);
    popHistory = []; stepTimes = [];
    updateStats(state);
    render();
    setConn(true);
  } catch(e) {
    setConn(false);
  }
}

async function apiTick() {
  try {
    if (pendingCells.length > 0) {
      await fetch(`${API}/set_cells`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cells: pendingCells }),
      });
      pendingCells = [];
    }
    const res   = await fetch(`${API}/tick`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ steps: 1 }),
    });
    const state = await res.json();
    cells = new Uint8Array(state.cells);
    updateStats(state);
    render();
    setConn(true);
  } catch(e) {
    setConn(false);
  }
}

async function flushPaint() {
  if (!pendingCells.length) return;
  try {
    const res   = await fetch(`${API}/set_cells`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cells: pendingCells }),
    });
    const state = await res.json();
    cells = new Uint8Array(state.cells);
    render();
    pendingCells = [];
  } catch(e) { setConn(false); }
}

setInterval(async () => { if (running) await apiTick(); }, TARGET_INTERVAL);

function cellAt(e) {
  const r = canvas.getBoundingClientRect();
  return {
    row: Math.floor((e.clientY - r.top)  / CELL),
    col: Math.floor((e.clientX - r.left) / CELL),
  };
}

canvas.addEventListener('mousedown', e => {
  const { row, col } = cellAt(e);
  if (row < 0 || row >= rows || col < 0 || col >= cols) return;
  paintValue = cells[row * cols + col] ? 0 : 1;
  cells[row * cols + col] = paintValue;
  pendingCells.push([row, col, paintValue]);
  render();
  painting = true;
});

canvas.addEventListener('mousemove', e => {
  if (!painting) return;
  const { row, col } = cellAt(e);
  if (row < 0 || row >= rows || col < 0 || col >= cols) return;
  if (cells[row * cols + col] === paintValue) return;
  cells[row * cols + col] = paintValue;
  pendingCells.push([row, col, paintValue]);
  render();
});

window.addEventListener('mouseup', () => {
  if (painting) { painting = false; flushPaint(); }
});

const btnPlay = document.getElementById('btn-play');
btnPlay.addEventListener('click', () => {
  running = !running;
  btnPlay.textContent = running ? 'Pause' : 'Play';
  btnPlay.classList.toggle('active', running);
});
document.getElementById('btn-step').addEventListener('click', async () => {
  running = false;
  btnPlay.textContent = 'Play';
  btnPlay.classList.remove('active');
  await apiTick();
});

document.getElementById('btn-clear').addEventListener('click', () => apiInit('random'));
document.querySelectorAll('[data-pattern]').forEach(btn =>
  btn.addEventListener('click', () => apiInit(btn.dataset.pattern))
);
document.getElementById('boundary-select').addEventListener('change', () => apiInit('random'));
window.addEventListener('keydown', e => {
  if (e.code === 'Space')      { e.preventDefault(); btnPlay.click(); }
  if (e.code === 'ArrowRight') {
    running = false;
    btnPlay.textContent = 'Play';
    btnPlay.classList.remove('active');
    apiTick();
  }
  if (e.code === 'KeyR') apiInit('random');
});
window.addEventListener('resize', () => apiInit('random'));

apiInit('random');
</script>
</body>
</html>
